# Plan on the PR, apply on merge, for the Cloudflare stacks in cloudflare/.
#
# - Pull request: plan every affected stack and post the plan on the PR.
#   Merging the PR approves that plan: no review is needed (small team), but
#   only someone in the TERRAFORM_APPROVERS repo variable can merge for it to
#   apply, by hand or with auto-merge. The "Terraform plan" check sums up the
#   plans; branch protection requires it, so auto-merge waits for it.
# - Push to main (the merge): the apply job waits in the "production"
#   environment until one of its required reviewers (the code owners) approves
#   the deployment in the Actions tab. If every plan on the merged PR said "No
#   changes", there is nothing to approve and the apply job is skipped. Then, for each affected stack, in
#   STACK_ORDER, plan again and apply only if the plan is the same as the one
#   last posted on the merged PR. If it differs (e.g. someone changed Cloudflare in the dashboard
#   after the PR was planned), nothing more is applied: sync the drift in a PR.
# - Manual run (Actions tab): plan only. Merging is the only way to apply.
# - Nightly: plan every stack; if anything differs from the code (someone
#   changed Cloudflare outside this repo) or the plan fails, post it to Slack
#   #ipni-alerts. Silent when everything matches.
# - Every merge that applies something, or fails to, is posted to #ipni-alerts.
#
# State safety: every plan and apply holds the S3 state lock, so two runs (or a
# run and a laptop) never write the same state at once; only main can assume
# the AWS role that writes state.
#
# Public repo: pull requests from forks get no secrets and no OIDC token, so
# their plan is skipped; a maintainer re-opens the change from a branch here.
name: Terraform (Cloudflare)

on:
  # Every PR, so the required "Terraform plan" check always reports; the
  # changes job picks the stacks to plan (none for unrelated PRs).
  pull_request:
  push:
    branches: [main]
    paths:
      - cloudflare/**
      - .github/workflows/terraform-cloudflare.yml
  schedule:
    - cron: "17 6 * * *" # drift check, daily 06:17 UTC
  workflow_dispatch:
    inputs:
      stacks:
        description: "Stacks to plan, space separated (or 'all'). Plan only."
        default: all
        required: true

permissions:
  contents: read

# On a PR, a new push cancels the old plan. Runs on main are never cancelled
# (each applies its own merge); the state lock serialises them.
concurrency:
  group: terraform-cloudflare-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_VERSION: 1.16.4
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-2
  # Apply order: the zones and notifications read pool IDs from load-balancing;
  # notifications goes last so it can also use IDs the zones create.
  STACK_ORDER: load-balancing inbrowser.link inbrowser.dev notifications

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.pick.outputs.stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT_STACKS: ${{ inputs.stacks }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch ]]; then
            [[ "$INPUT_STACKS" == all ]] && wanted="$STACK_ORDER" || wanted="$INPUT_STACKS"
          elif [[ -z "$BASE" || "$BASE" == 0000000000000000000000000000000000000000 ]]; then
            wanted="$STACK_ORDER"
          else
            files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
            wanted=""
            if grep -q '^\.github/workflows/terraform-cloudflare\.yml$' <<<"$files"; then wanted="$STACK_ORDER"; fi
            if grep -q '^cloudflare/modules/' <<<"$files"; then wanted+=" inbrowser.link inbrowser.dev"; fi
            for s in $STACK_ORDER; do
              if grep -q "^cloudflare/$s/" <<<"$files"; then wanted+=" $s"; fi
            done
          fi
          # Keep STACK_ORDER order, drop duplicates and unknown names.
          stacks=$(for s in $STACK_ORDER; do if [[ " $wanted " == *" $s "* ]]; then echo "$s"; fi; done | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"
          echo "Stacks: $stacks"

  plan:
    needs: changes
    if: >-
      github.event_name != 'push' && needs.changes.outputs.stacks != '[]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.changes.outputs.stacks) }}
    defaults:
      run:
        working-directory: cloudflare/${{ matrix.stack }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READ }}
      TF_VAR_slack_webhook_url: ${{ secrets.SWG_ALERTS_SLACK_WEBHOOK_URL }}
      TF_VAR_rainbow_origins: ${{ secrets.RAINBOW_ORIGINS }}
      TF_VAR_alert_emails: ${{ secrets.SWG_ALERT_EMAILS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TERRAFORM_CLOUDFLARE_PLAN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - run: terraform fmt -check -recursive ..
      - run: terraform init -lockfile=readonly
      - run: terraform validate

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -lock-timeout=10m -detailed-exitcode -out=tfplan > plan.log 2>&1
          code=$?
          set -e
          cat plan.log
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          [[ $code -eq 1 ]] && exit 1
          terraform show -no-color tfplan > plan.txt
          ../../.github/scripts/terraform-plan-changes.sh tfplan > changes.txt
          {
            echo "### \`${{ matrix.stack }}\`"
            if [[ $code -eq 0 ]]; then echo "No changes."; else echo '```'; cat changes.txt; grep -E '^Plan:' plan.txt || true; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report drift to Slack
        if: >-
          always() && github.event_name == 'schedule' &&
          (steps.plan.outcome == 'failure' || steps.plan.outputs.exitcode == '2')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SWG_ALERTS_SLACK_WEBHOOK_URL }}
          STACK: ${{ matrix.stack }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ steps.plan.outcome == 'failure' }}
        run: |
          set -euo pipefail
          if [[ "$FAILED" == true ]]; then
            printf ':x: *Cloudflare drift check failed* for %s. <%s|Run>\n' "\`$STACK\`" "$RUN_URL"
          else
            printf ':warning: *Cloudflare drift* on %s: %s\n' "\`$STACK\`" "$(grep -E '^Plan:' plan.txt || echo 'outputs changed')"
            printf 'Cloudflare differs from the code, most likely a dashboard change. Sync it into the code in a PR (or revert it in the dashboard). <%s|Plan>\n' "$RUN_URL"
            awk '{print "• " $1 " `" $2 "`"}' changes.txt
          fi | ../../.github/scripts/slack-post.sh

      # The merge compares its own plan with this one before applying.
      - name: Upload plan summary
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-changes-${{ matrix.stack }}
          path: cloudflare/${{ matrix.stack }}/changes.txt
          retention-days: 30

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STACK: ${{ matrix.stack }}
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
          PLAN_DIR: cloudflare/${{ matrix.stack }}
        with:
          script: |
            const fs = require('fs');
            const { STACK, EXITCODE, PLAN_DIR } = process.env;
            const marker = `<!-- terraform-cloudflare-plan:${STACK} -->`;
            let plan = fs.readFileSync(`${PLAN_DIR}/plan.txt`, 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated, see the run log)';
            const summary = EXITCODE === '0' ? 'No changes' : (plan.match(/^Plan: .*$/m) || ['Changes to outputs only'])[0];
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n#### Terraform plan: \`${STACK}\`: ${summary}\n\nApplied on merge if the plan is still the same.\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>\n\n[Run](${run}) · commit ${context.payload.pull_request.head.sha.slice(0, 7)}`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const old = comments.find(c => c.body.startsWith(marker));
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  # The one check branch protection requires: all affected stacks planned.
  plan-result:
    name: Terraform plan
    needs: [changes, plan]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          PLAN: ${{ needs.plan.result }}
          STACKS: ${{ needs.changes.outputs.stacks }}
        run: |
          set -euo pipefail
          [[ "$CHANGES" == success ]] || { echo "::error::Picking the stacks failed."; exit 1; }
          if [[ "$STACKS" == '[]' ]]; then echo "No stacks affected."; exit 0; fi
          # Skipped with stacks to plan means a fork PR: no secrets, no plan.
          [[ "$PLAN" == success ]] || { echo "::error::Plan $PLAN for $STACKS."; exit 1; }
          echo "Planned: $STACKS"

  # Reads the plans posted on the merged PR. If none of them has a change,
  # the apply job (and its approval request) is skipped. A failure here fails
  # the run, so a problem is never mistaken for "nothing to apply"; the apply
  # job still makes all its own checks when it runs.
  pr-plans:
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          STACKS: ${{ needs.changes.outputs.stacks }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)][0]')
          if [[ -z "$pr" || "$pr" == null ]]; then
            echo "::error::$GITHUB_SHA is not a merged PR. Changes to cloudflare/ must go through a PR."
            exit 1
          fi
          number=$(jq -r .number <<<"$pr"); head=$(jq -r .head.sha <<<"$pr")
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow terraform-cloudflare.yml --event pull_request --commit "$head" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run" ]]; then
            echo "::error::No successful plan on PR #$number for its last commit ${head:0:7}. Nothing applied."
            exit 1
          fi
          dir="$RUNNER_TEMP/pr-plans"
          gh run download "$run" -R "$GITHUB_REPOSITORY" --pattern 'plan-changes-*' --dir "$dir"
          has_changes=false
          for stack in $(jq -r '.[]' <<<"$STACKS"); do
            f="$dir/plan-changes-$stack/changes.txt"
            if [[ ! -f "$f" ]]; then
              echo "$stack: no plan on PR #$number; the apply job will report it."
              has_changes=true
            elif [[ -s "$f" ]]; then
              echo "$stack: changes planned on PR #$number"
              has_changes=true
            else
              echo "$stack: no changes on PR #$number"
            fi
          done
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"
          if [[ "$has_changes" == false ]]; then
            echo "Nothing to apply: every plan on PR #$number had no changes. Skipping the apply and its approval." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  apply:
    needs: [changes, pr-plans]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.stacks != '[]' && needs.pr-plans.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    # Waits for a required reviewer (a code owner) to approve the deployment.
    # The AWS apply role only trusts jobs in this environment.
    environment: production
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      actions: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_slack_webhook_url: ${{ secrets.SWG_ALERTS_SLACK_WEBHOOK_URL }}
      TF_VAR_rainbow_origins: ${{ secrets.RAINBOW_ORIGINS }}
      TF_VAR_alert_emails: ${{ secrets.SWG_ALERT_EMAILS }}
      GH_TOKEN: ${{ github.token }}
      STACKS: ${{ needs.changes.outputs.stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TERRAFORM_CLOUDFLARE_APPLY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Find the merged PR, check who merged it and its last plan
        id: pr
        env:
          TERRAFORM_APPROVERS: ${{ vars.TERRAFORM_APPROVERS }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)][0]')
          if [[ -z "$pr" || "$pr" == null ]]; then
            echo "::error::$GITHUB_SHA is not a merged PR. Changes to cloudflare/ must go through a PR."
            exit 1
          fi
          number=$(jq -r .number <<<"$pr"); head=$(jq -r .head.sha <<<"$pr")
          { echo "number=$number"; echo "title=$(jq -r .title <<<"$pr")"; } >> "$GITHUB_OUTPUT"

          # Merging is the approval: the merger (who enabled auto-merge, for an
          # auto-merged PR) must be an approver. The author may merge their own.
          merger=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '.merged_by.login // empty')
          if [[ -z "$merger" || " $TERRAFORM_APPROVERS " != *" $merger "* ]]; then
            echo "::error::PR #$number was merged by '${merger:-unknown}', who is not one of: $TERRAFORM_APPROVERS. Nothing applied."
            exit 1
          fi
          echo "Merged by $merger"
          echo "merger=$merger" >> "$GITHUB_OUTPUT"

          run=$(gh run list --workflow terraform-cloudflare.yml --event pull_request --commit "$head" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run" ]]; then
            echo "::error::No successful plan on PR #$number for its last commit ${head:0:7}. Nothing applied."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pr-plans"
          gh run download "$run" --pattern 'plan-changes-*' --dir "$RUNNER_TEMP/pr-plans"
          echo "PR #$number, plan run $run"

      - name: Plan, compare with the PR, apply
        env:
          PR_PLANS: ${{ runner.temp }}/pr-plans
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/results.txt"
          for stack in $(jq -r '.[]' <<<"$STACKS"); do
            echo "::group::$stack"
            echo "STACK $stack" >> "$results"
            cd "$GITHUB_WORKSPACE/cloudflare/$stack"
            terraform init -lockfile=readonly
            set +e
            terraform plan -lock-timeout=10m -detailed-exitcode -out=tfplan
            code=$?
            set -e
            [[ $code -eq 1 ]] && { echo "::error::$stack: plan failed"; exit 1; }
            "$GITHUB_WORKSPACE/.github/scripts/terraform-plan-changes.sh" tfplan > changes.txt
            reviewed="$PR_PLANS/plan-changes-$stack/changes.txt"
            if [[ ! -f "$reviewed" ]]; then
              echo "::error::$stack: no plan for this stack on PR #$PR_NUMBER. Nothing more applied."
              exit 1
            fi
            if ! diff -u "$reviewed" changes.txt; then
              echo "::error::$stack: the plan differs from the one on PR #$PR_NUMBER (diff above), e.g. a dashboard change since the PR was planned. Nothing more applied: sync it in a PR."
              exit 1
            fi
            if [[ $code -eq 0 ]]; then
              echo "$stack: no changes"
              echo "### \`$stack\`: no changes" >> "$GITHUB_STEP_SUMMARY"
              echo "NOCHANGE $stack" >> "$results"
            else
              terraform apply -lock-timeout=10m tfplan
              { echo "### \`$stack\`: applied"; echo '```'; cat changes.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              { echo "APPLIED $stack"; awk '{print "CHANGE " $1 " " $2}' changes.txt; } >> "$results"
            fi
            echo "::endgroup::"
          done

      # Posts what was applied, or that the apply failed, to #ipni-alerts.
      # Silent when the merge changed nothing in Cloudflare.
      - name: Report to Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SWG_ALERTS_SLACK_WEBHOOK_URL }}
          OUTCOME: ${{ job.status }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          MERGER: ${{ steps.pr.outputs.merger }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/results.txt"
          touch "$results"
          if [[ "$OUTCOME" == success ]] && ! grep -q '^APPLIED ' "$results"; then
            echo "Nothing applied; not posting."; exit 0
          fi
          esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          pr="a push to main"
          [[ -n "$PR_NUMBER" ]] && pr="<$REPO_URL/pull/$PR_NUMBER|#$PR_NUMBER> $(esc <<<"$PR_TITLE")"
          by=""; [[ -n "$MERGER" ]] && by=" (merged by $MERGER)"
          {
            if [[ "$OUTCOME" == success ]]; then
              echo ":white_check_mark: *Cloudflare applied* $pr$by"
            else
              echo ":x: *Cloudflare apply stopped* on $pr$by. Stacks after the failing one were not applied."
            fi
            # A STACK line without APPLIED/NOCHANGE after it is the one that failed.
            awk -v bt='`' '
              $1 == "STACK"    { pending = $2 }
              $1 == "APPLIED"  { print bt $2 bt ": applied"; pending = "" }
              $1 == "CHANGE"   { print "    • " $2 " " bt $3 bt }
              $1 == "NOCHANGE" { print bt $2 bt ": no changes"; pending = "" }
              END { if (pending != "") print bt pending bt ": failed (see the run)" }' "$results"
            echo "<$RUN_URL|Run>"
          } | .github/scripts/slack-post.sh
